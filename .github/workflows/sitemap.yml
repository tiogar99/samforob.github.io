name: Sitemap

on:
  push:
    branches: [main]
    # Only page content affects the sitemap. Leaving sitemap.xml out of this
    # list is what stops the commit below from retriggering this workflow.
    paths:
      - '**.html'
      - 'CNAME'
      - 'scripts/generate_sitemap.py'
      - '.github/workflows/sitemap.yml'
  pull_request:
    paths:
      - '**.html'
      - 'CNAME'
      - 'scripts/generate_sitemap.py'
      - 'sitemap.xml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sitemap-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regenerate:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # <lastmod> is read from each file's last commit, so we need history.
          fetch-depth: 0

      - name: Regenerate sitemap.xml
        run: python3 scripts/generate_sitemap.py

      - name: Commit if it changed
        run: |
          if git diff --quiet -- sitemap.xml; then
            echo "sitemap.xml unchanged; nothing to commit"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sitemap.xml
          git commit -m 'Regenerate sitemap.xml'
          git push

  check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify sitemap.xml is current
        run: python3 scripts/generate_sitemap.py --check
